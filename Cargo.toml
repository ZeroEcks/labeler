[package]
name = "labeler"
version = "0.3.3"
edition = "2024"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unsafe-derive-deserialize = "allow"

[dependencies]
# secrets for dev & prod
secretspec = { version = "0.19.1", default-features = false }
secretspec-derive = "0.19.1"
# required directly by secretspec_derive::declare_secrets! generated code
serde = { version = "1", features = ["derive"] }
secrecy = "0.10"
# async runtime for stripe + axum
tokio = { version = "1", features = ["full"] }
# stripe client
async-stripe = "=1.0.0-rc.8"
async-stripe-core = { version = "=1.0.0-rc.8", features = ["customer"] }
async-stripe-shared = { version = "=1.0.0-rc.8" }
async-stripe-billing = { version = "=1.0.0-rc.8", features = ["subscription"] }
# date handling for the /report start_date query param
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# web framework
axum = { version = "0.8.9", features = ["http2"] }
# structured logging: access-log middleware + trace-level spans/events
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
# Typst -> PDF rendering for the /report endpoint. `typst-kit-embed-fonts`
# bakes typst's default fonts (New Computer Modern, via `typst-assets`) into
# the binary at compile time, so rendering needs no network or system font
# access at runtime.
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
typst-as-lib = { version = "0.16", features = [
  "typst-kit-fonts",
  "typst-kit-embed-fonts",
] }

[dev-dependencies]
lopdf = { version = "0.44.0", default-features = false }
