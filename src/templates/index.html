<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Labler: Print Shipping Labels</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
</head>

<body>
  <main class="container">
    <h1>Labler: Print Shipping Labels</h1>
    <p>
      Shipping labels for customers with a subscription active any time
      since the start date below.
    </p>

    <label for="start_date">
      Report start date
      <input type="date" id="start_date" name="start_date" value="%%DEFAULT_DATE%%" max="%%TODAY%%" />
    </label>

    <div class="grid">
      <a role="button" id="get-report" download="shipping-labels.pdf">Get report</a>
      <a role="button" class="secondary" id="export-csv" download="subscriptions.csv">Export CSV</a>
    </div>

    <h2>Preview</h2>
    <input
      type="search"
      id="preview-search"
      placeholder="Filter preview…"
      aria-label="Filter preview"
      disabled
    />
    <p id="preview-count"></p>
    <div id="preview" aria-busy="true">Loading preview…</div>
  </main>

  <script>
    const dateInput = document.getElementById("start_date");
    const getReport = document.getElementById("get-report");
    const exportCsv = document.getElementById("export-csv");
    const preview = document.getElementById("preview");
    const previewSearch = document.getElementById("preview-search");
    const previewCount = document.getElementById("preview-count");

    let previewRows = [];

    function applyFilter() {
      const term = previewSearch.value.trim().toLowerCase();
      let visible = 0;
      for (const row of previewRows) {
        const match = !term || row.textContent.toLowerCase().includes(term);
        row.style.display = match ? "" : "none";
        if (match) visible++;
      }
      previewCount.textContent = term
        ? `${visible} of ${previewRows.length} subscriptions`
        : `${previewRows.length} subscription${previewRows.length === 1 ? "" : "s"}`;
    }

    function update() {
      const startDate = encodeURIComponent(dateInput.value);
      getReport.href = `/report/pdf?start_date=${startDate}`;
      exportCsv.href = `/report/csv?start_date=${startDate}`;

      previewRows = [];
      previewSearch.disabled = true;
      previewCount.textContent = "";
      preview.setAttribute("aria-busy", "true");
      preview.innerHTML = "Loading preview…";

      fetch(`/report/table?start_date=${startDate}`)
        .then((response) => {
          if (!response.ok) {
            throw new Error(`${response.status} ${response.statusText}`);
          }
          return response.text();
        })
        .then((html) => {
          preview.removeAttribute("aria-busy");
          preview.innerHTML = html;
          previewRows = Array.from(preview.querySelectorAll("tbody tr"));
          previewSearch.disabled = false;
          previewSearch.value = "";
          applyFilter();
        })
        .catch((err) => {
          preview.removeAttribute("aria-busy");
          preview.innerHTML = `<p>Failed to load preview: ${err.message}</p>`;
          previewRows = [];
          previewCount.textContent = "";
          previewSearch.disabled = true;
        });
    }

    previewSearch.addEventListener("input", applyFilter);
    dateInput.addEventListener("change", update);
    update();
  </script>
</body>

</html>
