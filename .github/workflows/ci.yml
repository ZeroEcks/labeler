name: CI

on:
  push:
    branches: [main]

permissions: {}

jobs:
  zizmor:
    name: Scan workflows with zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload the results to advanced security
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  test:
    name: flake check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Set up Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: zeroecks-labeler
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake (formatting, tests)
        run: |
          nix flake check --accept-flake-config

  container:
    name: Release container image
    needs: [zizmor, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-tags: true

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Set up Cachix
        if: github.event_name == 'push'
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: zeroecks-labeler
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image and retag as release if appropriate
        if: github.event_name == 'push'
        run: |
          nix shell .#ci -c build-image-push-image-tag-release --accept-flake-config
