name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  SECRETSPEC_PROVIDER: "env"
  SECRETSPEC_PROFILE: "default"
  STRIPE_SECRET_KEY: sk-dummy

jobs:
  zizmor:
    name: Scan workflows with zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload the results to advanced security
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  test:
    name: devenv test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Enable cache pushing
        run: echo '{ cachix.push = "zeroecks-labeler"; }' > devenv.local.nix

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/devenv.lock', '**/devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 3G
          purge: true
          purge-last-accessed: P3D
          purge-primary-key: never

      - name: Set up the devenv Cachix cache
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cmd-format: devenv shell -c -- {0}

      - name: Build the devenv shell and run clippy/tests
        run: devenv test

  container:
    name: Build container images
    needs: [zizmor, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Enable cache pushing
        run: echo '{ cachix.push = "zeroecks-labeler"; }' > devenv.local.nix

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/devenv.lock', '**/devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 3G
          purge: true
          purge-last-accessed: P3D
          purge-primary-key: never

      - name: Set up the devenv Cachix cache
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cmd-format: devenv shell -c -- {0}

      - name: Compute image tags
        id: image
        run: |
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "app=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"

      - name: Build the container
        run: devenv container build labeler

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the Cloudron image
        if: github.event_name == 'push'
        env:
          APP_IMAGE: ${{ steps.image.outputs.app }}
          SHA: ${{ github.sha }}
        run: |
          devenv container --registry docker://ghcr.io copy labeler
          docker push "${APP_IMAGE}:${SHA}"
          docker push "${APP_IMAGE}:latest"
