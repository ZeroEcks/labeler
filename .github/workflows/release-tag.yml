name: Release tag

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

permissions: {}

jobs:
  tag-release:
    name: Push the release version tag (CI just finished)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Find a release tag for this commit
        id: tag
        run: |
          version="$(git tag --points-at HEAD | grep -m1 '^v[0-9]' || true)"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Crane
        if: steps.tag.outputs.version != ''
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Retag Image Remotely
        if: steps.tag.outputs.version != ''
        env:
          SHA: ${{ inputs.sha }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          crane tag "ghcr.io/zeroecks/labeler:${SHA}" "${RELEASE_VERSION}"
