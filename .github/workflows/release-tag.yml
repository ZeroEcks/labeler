name: Release tag

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

permissions: {}

jobs:
  on-tag-push:
    name: Push the release version tag (already-built commit)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: write
    steps:
      - name: Check CI status for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          conclusion="$(gh run list --repo "${{ github.repository }}" --workflow CI --commit "$SHA" --json conclusion,status --jq '.[0] | if .status != "completed" then "" else .conclusion end')"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Set up Crane
        if: steps.tag.outputs.version != ''
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Retag Image Remotely
        if: steps.ci.outputs.conclusion == 'success'
        env:
          SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          crane tag "ghcr.io/zeroecks/labeler:${SHA}" "${RELEASE_VERSION#v}"

      - name: Fail if CI already concluded unsuccessfully
        if: steps.ci.outputs.conclusion != '' && steps.ci.outputs.conclusion != 'success'
        env:
          SHA: ${{ github.sha }}
          CONCLUSION: ${{ steps.ci.outputs.conclusion }}
        run: |
          echo "CI run for $SHA concluded with '$CONCLUSION'; not releasing." >&2
          exit 1

  on-ci-completed:
    name: Push the release version tag (CI just finished)
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Find a release tag for this commit
        id: tag
        run: |
          version="$(git tag --points-at HEAD | grep -m1 '^v[0-9]' || true)"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Crane
        if: steps.tag.outputs.version != ''
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Retag Image Remotely
        if: steps.tag.outputs.version != ''
        env:
          SHA: ${{ inputs.sha }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          crane tag "ghcr.io/zeroecks/labeler:${SHA}" "${RELEASE_VERSION}"
